apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-metadata-deployment
  labels:
    app: pod-metadata
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pod-metadata
  template:
    metadata:
      labels:
        app: pod-metadata
    spec:
      containers:
      - name: pod-metadata
        image: 632823263537.dkr.ecr.us-east-1.amazonaws.com/pod-metadata-display:latest
        ports:
        - name: http
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10

        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name 
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName